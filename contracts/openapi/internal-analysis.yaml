openapi: 3.1.0
info:
  title: VideoService Analysis (internal)
  version: 0.1.0
  description: |
    Internal API of the analysis service (receives `video.processed.v1` and `video.deleted.v1` events). Reachable only by other services inside the compose network
    (`http://analysis:8080`), protected by the `X-Internal-Key` header (`INTERNAL_API_KEY` variable).
    Not published through the gateway: an external `/internal/**` request gets 404.
    The service's public route (`GET /api/videos/{id}/description`) is described in `api.yaml`.
servers:
  - url: http://analysis:8080
security:
  - internalKey: []
tags:
  - name: Internal
paths:
  /internal/v1/events/video-processed:
    post:
      tags: [Internal]
      operationId: AcceptVideoProcessed
      summary: Accept the "video processed" event
      description: |
        Sent by the videos outbox dispatcher (`OutboxDispatcher` in media-worker; subscriber `analysis`, address `Outbox__Subscribers__analysis__BaseUrl`); retried with backoff.
        Idempotent by `videoId`: a redelivery returns 202 and does not create a second analysis job.
        Validation: `schemaVersion` = 1; `eventId` and `videoId` are non-empty; `ownerId` is required (up to 128 characters);
        `sourceKey` equals `uploads/{videoId:N}/source`; `durationMs`, `width`, `height` > 0.
        Body schema: `contracts/events/video-processed.v1.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../events/video-processed.v1.json'
      responses:
        '202':
          description: Accepted (analysis queued or already existed)
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created: { type: boolean, description: 'true: analysis created now; false: redelivery' }
        '400':
          description: Event failed validation
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401':
          description: Missing or invalid `X-Internal-Key`
  /internal/v1/events/video-deleted:
    post:
      tags: [Internal]
      operationId: ForgetVideo
      summary: Accept the "video deleted" event
      description: |
        Deletes the analysis and description of the video. Idempotent: a repeat or an event for an already unknown video returns 202.
        Validation: `schemaVersion` = 1; `eventId` and `videoId` are non-empty. Body schema: `contracts/events/video-deleted.v1.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../events/video-deleted.v1.json'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created: { type: boolean, description: 'true: analysis existed and was deleted now' }
        '400':
          description: Event failed validation
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '401':
          description: Missing or invalid `X-Internal-Key`
components:
  securitySchemes:
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
  schemas:
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
